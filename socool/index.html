<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoCool · 酷安动态搜索</title>
<meta name="description" content="酷安动态全文搜索，数据来自公开镜像。自己用的检索页。">
<style>
:root{
  --bg:#fbfbfa;
  --card:#fff;
  --ink:#1b1c1e;
  --ink-2:#5c6066;
  --ink-3:#9aa0a6;
  --line:#e8e8e5;
  --accent:#1f9d55;
  --accent-soft:#eaf7ef;
  --mark:#fff2a8;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 80px}

/* 顶部 */
.head{padding:56px 0 28px;text-align:center}
.brand{
  font-size:34px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;
  color:var(--accent);
}
.brand span{color:var(--ink)}
.tagline{margin:0;color:var(--ink-3);font-size:13.5px}

/* 搜索框 */
.searchbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 14px}
.box{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:4px 6px 4px 16px;
  transition:border-color .18s,box-shadow .18s;
}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.box svg{flex:0 0 auto;color:var(--ink-3)}
#q{
  flex:1;border:0;outline:0;background:transparent;
  font-size:16px;padding:11px 0;color:var(--ink);font-family:inherit;
}
#q::placeholder{color:var(--ink-3)}
.btn{
  border:0;background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f2f2ef}

/* 标签胶囊 */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 10px}
.chips.collapsed{max-height:34px;overflow:hidden}
.chip-toggle{
  display:inline-block;border:0;background:none;font-family:inherit;
  font-size:12.5px;color:var(--ink-3);cursor:pointer;padding:4px 2px;margin-bottom:12px;
}
.chip-toggle:hover{color:var(--accent)}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:4px 11px;border-radius:999px;font-size:12.5px;cursor:pointer;
  transition:all .15s;white-space:nowrap;font-family:inherit;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 状态栏 */
.status{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;color:var(--ink-3);margin:0 2px 12px;min-height:20px;
}
.status b{color:var(--ink-2);font-weight:600}

/* 卡片 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:11px;transition:border-color .15s,transform .15s;
}
.card:hover{border-color:#d6d6d2}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.who{font-weight:650;font-size:13.5px;color:var(--ink)}
.dot{color:var(--line)}
.meta{font-size:12px;color:var(--ink-3)}
.id{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.text{
  white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;
}
.card.open .text{-webkit-line-clamp:unset;display:block}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.tg{
  font-size:12px;color:var(--accent);background:var(--accent-soft);
  padding:2px 9px;border-radius:999px;cursor:pointer;
}
.tg:hover{filter:brightness(.96)}
.more{
  margin-left:auto;font-size:12.5px;color:var(--ink-3);cursor:pointer;
  border:0;background:none;font-family:inherit;padding:2px 0;
}
.more:hover{color:var(--accent)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:3px}

.empty{text-align:center;color:var(--ink-3);padding:60px 20px;font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px}

/* 复制提示 */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#23252a;color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;
  box-shadow:0 6px 22px rgba(0,0,0,.18);
}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{
  margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-3);line-height:1.9;
}
footer a{color:var(--ink-2);border-bottom:1px solid var(--line)}
footer a:hover{color:var(--accent);border-color:var(--accent)}

@media (max-width:560px){
  .head{padding:34px 0 20px}
  .brand{font-size:27px}
  .wrap{padding:0 14px 60px}
  #share{padding:9px 10px;font-size:12.5px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <h1 class="brand">So<span>Cool</span></h1>
    <p class="tagline">酷安动态全文检索 · 自己用的</p>
  </header>

  <div class="searchbar">
    <div class="box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
      <input id="q" type="search" placeholder="搜关键词，用空格分词…" autocomplete="off" spellcheck="false">
      <button class="btn ghost" id="share" title="复制当前搜索的链接">复制链接</button>
      <button class="btn" id="go">搜索</button>
    </div>
  </div>

  <div class="chips collapsed" id="chips"></div>
  <button class="chip-toggle" id="chipToggle" hidden></button>

  <div class="status">
    <span id="stat">加载索引中…</span>
    <span id="hint"></span>
  </div>

  <div id="list"></div>

  <footer>
    <div>数据抓取自 <a href="https://www.coolapk1s.com/" target="_blank" rel="noopener">coolapk1s.com</a> 的公开页面，内容版权归原作者与酷安所有。</div>
    <div>索引生成于 <span id="gen">—</span>，共 <span id="total">—</span> 条。点卡片正文可展开，点「原帖」跳酷安。</div>
  </footer>
</div>
<div id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const listEl = $('#list'), statEl = $('#stat'), chipsEl = $('#chips'), qEl = $('#q');
  const toggleEl = $('#chipToggle');
  const toastEl = $('#toast');
  const PAGE = 120;

  let DATA = [];
  let TAGS = [];
  let view = [];        // 当前结果
  let shown = 0;        // 已渲染
  let activeTag = null;
  let terms = [];

  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function hl(text){
    if(!terms.length) return esc(text);
    let out = esc(text);
    // 长词优先，避免短词吃掉长词
    const pat = terms.slice().sort((a,b)=>b.length-a.length)
      .map(t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
    if(!pat) return out;
    return out.replace(new RegExp('(' + pat + ')', 'gi'), '<mark>$1</mark>');
  }

  function match(item){
    if(activeTag && !item.g.includes(activeTag)) return false;
    if(!terms.length) return true;
    const hay = (item.t + ' ' + item.a + ' ' + item.g.join(' ')).toLowerCase();
    return terms.every(t => hay.includes(t));
  }

  function cardHTML(it){
    const tags = it.g.map(t => `<span class="tg" data-tag="${esc(t)}">${esc(t)}</span>`).join('');
    const meta = it.m ? `<span class="dot">·</span><span class="meta">${it.m} 图</span>` : '';
    return `<article class="card" data-id="${it.i}">
      <div class="card-top">
        <span class="who">${esc(it.a || '匿名')}</span>${meta}
        <span class="id">#${it.i}</span>
      </div>
      <div class="text">${hl(it.t)}</div>
      <div class="card-foot">
        ${tags}
        <a class="more" href="https://www.coolapk.com/feed/${it.i}" target="_blank" rel="noopener">原帖 ↗</a>
      </div>
    </article>`;
  }

  function render(reset){
    if(reset){ listEl.innerHTML = ''; shown = 0; }
    const slice = view.slice(shown, shown + PAGE);
    listEl.insertAdjacentHTML('beforeend', slice.map(cardHTML).join(''));
    shown += slice.length;
    if(shown < view.length){
      listEl.insertAdjacentHTML('beforeend',
        `<div style="text-align:center;padding:16px 0">
           <button class="btn ghost" id="more">再显示 ${Math.min(PAGE, view.length-shown)} 条（还剩 ${view.length-shown}）</button>
         </div>`);
      const b = $('#more');
      if(b) b.onclick = () => { b.parentElement.remove(); render(false); };
    }
  }

  // —— 地址栏同步：?q=关键词&t=标签 ——
  function readURL(){
    const p = new URLSearchParams(location.search);
    const kw = p.get('q'), tag = p.get('t');
    if(kw) qEl.value = kw;
    if(tag) activeTag = tag;
  }

  function syncURL(){
    const p = new URLSearchParams();
    const kw = qEl.value.trim();
    if(kw) p.set('q', kw);
    if(activeTag) p.set('t', activeTag);
    const qs = p.toString();
    const url = location.pathname + (qs ? '?' + qs : '');
    if(url !== location.pathname + location.search){
      history.replaceState(null, '', url);
    }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('on'), 1600);
  }

  function apply(){
    const kw = qEl.value.trim();
    terms = kw ? kw.toLowerCase().split(/\s+/).filter(Boolean) : [];
    view = DATA.filter(match);
    statEl.innerHTML = kw || activeTag
      ? `命中 <b>${view.length}</b> 条 / 共 ${DATA.length} 条`
      : `共 <b>${DATA.length}</b> 条动态`;
    syncURL();
    document.title = kw || activeTag
      ? `${kw || activeTag} · SoCool 搜索`
      : 'SoCool · 酷安动态搜索';
    if(!view.length){
      listEl.innerHTML = `<div class="empty"><b>没搜到</b>换个词试试，或者点上面的标签逛逛</div>`;
      shown = 0;
      return;
    }
    render(true);
  }

  let chipsOpen = false;
  function paintChips(){
    chipsEl.innerHTML = TAGS.map(t =>
      `<button class="chip${activeTag===t.n?' on':''}" data-tag="${esc(t.n)}">${esc(t.n)} <span style="opacity:.55">${t.c}</span></button>`
    ).join('');
    const needCollapse = !chipsOpen && !activeTag;
    chipsEl.classList.toggle('collapsed', needCollapse);
    if(TAGS.length > 8){
      toggleEl.hidden = false;
      toggleEl.textContent = chipsOpen ? '收起标签' : `展开全部 ${TAGS.length} 个标签 ↓`;
    }
  }
  toggleEl.addEventListener('click', () => {
    chipsOpen = !chipsOpen;
    paintChips();
  });

  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if(!b) return;
    activeTag = activeTag === b.dataset.tag ? null : b.dataset.tag;
    paintChips(); apply();
  });

  listEl.addEventListener('click', e => {
    const tg = e.target.closest('.tg');
    if(tg){
      activeTag = tg.dataset.tag;
      paintChips(); apply();
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    const card = e.target.closest('.card');
    if(card && !e.target.closest('a')) card.classList.toggle('open');
  });

  let timer;
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(apply, 160);
  });
  qEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ clearTimeout(timer); apply(); }
    if(e.key === 'Escape'){ qEl.value=''; activeTag=null; paintChips(); apply(); }
  });
  $('#go').onclick = () => apply();

  // 复制当前搜索的独立链接
  $('#share').onclick = async () => {
    clearTimeout(timer);
    apply();
    const url = location.href;
    try{
      await navigator.clipboard.writeText(url);
      toast('链接已复制，可以直接发人');
    }catch(err){
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      if(ok) toast('链接已复制，可以直接发人');
      else window.prompt('手动复制这个链接：', url);
    }
  };

  document.addEventListener('keydown', e => {
    if(e.key === '/' && document.activeElement !== qEl){
      e.preventDefault(); qEl.focus();
    }
  });

  fetch('data/index.json')
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      DATA = d.items || [];
      TAGS = d.tags || [];
      $('#total').textContent = DATA.length;
      $('#gen').textContent = d.generated || '—';
      $('#hint').textContent = DATA.length ? '按 / 聚焦搜索框' : '';
      readURL();          // 打开链接时先取关键词与标签
      paintChips();
      apply();
    })
    .catch(err => {
      statEl.textContent = '索引加载失败';
      listEl.innerHTML = `<div class="empty"><b>索引没加载出来</b>
        可能是本地直接双击打开了文件（浏览器不让读本地 JSON）。<br>
        用 <code>python -m http.server</code> 起个本地服务再看。</div>`;
      console.error(err);
    });
})();
</script>
</body>
</html>
