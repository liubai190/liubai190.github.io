---
layout: default
---

<div class="category-page">
  <h1>{{ page.title }}</h1>
  <p class="category-note">{{ page.note }}</p>

  <ul class="post-list">
    {%- for post in site.categories[page.cat_name] -%}
    <li>
      <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
      <h3>
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title | escape }}
        </a>
      </h3>
    </li>
    {%- endfor -%}
  </ul>

  <p><a href="{{ '/' | relative_url }}" class="back-link">&larr; 返回首页</a></p>
</div>
