<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中国象棋 · 人机对弈</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
<script>/* 沉浸 / 墨水屏刷新后接着用：提前打 class，免得先闪一帧页头与面板。
   墨水屏是自用开关（绝大多数人不会在墨水屏上下棋），入口只有地址栏 ?ink=1/?ink=0，
   而且一开就强制进沉浸 —— 既然是墨水屏，本来就是只看棋盘。 */
try {
  var im = location.search.match(/[?&]ink=([01])(?=[&#]|$)/);
  if (im) localStorage.setItem('graywood.ink', im[1]);
  var inkMode = localStorage.getItem('graywood.ink') === '1';
  if (inkMode) document.documentElement.className += ' ink immersive';
  else if (localStorage.getItem('graywood.chinese.imm') === '1')
    document.documentElement.className += ' immersive';
} catch (e) {}
</script>
</head>
<body>

<div class="wrap">
  <header class="head">
    <span class="topnav">
      <a href="/chess/">← 象棋</a>
      <a href="/">灰木</a>
    </span>
    <h1>中国象棋</h1>
    <p class="sub" id="sub">单机人机对弈 · 红先 · 三档难度</p>
  </header>

  <div class="game">
    <div class="board-box" id="boardBox">
      <canvas id="board"></canvas>
    </div>

    <div class="panel">
      <div class="status" id="status">轮到你走</div>

      <div class="row">
        <div class="field">
          <div class="label">模式</div>
          <div class="seg" id="modes">
            <button type="button" data-mode="pve" class="on">人机</button>
            <button type="button" data-mode="pvp">双人</button>
          </div>
        </div>

        <div class="field" id="levelField">
          <div class="label">难度</div>
          <div class="seg" id="levels">
            <button type="button" data-level="2">简单</button>
            <button type="button" data-level="4" class="on">中级</button>
            <button type="button" data-level="6">高手</button>
          </div>
        </div>

        <div class="field">
          <div class="label">操作</div>
          <div class="btns">
            <button type="button" id="undo">悔棋</button>
            <button type="button" id="restart">重新开始</button>
            <button type="button" id="rotate" title="把棋盘顺时针转 90 度，点四次转回原位">旋转</button>
            <button type="button" id="immersive" title="只留棋盘，Esc 或左上角按钮退出">沉浸</button>
          </div>
        </div>

        <div class="field">
          <div class="label">选项</div>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="dots"> 走法提示</label>
            <label class="toggle"><input type="checkbox" id="sound" checked> 音效</label>
            <button type="button" class="link" id="ink" title="白底黑线的墨水屏模式（地址栏 ?ink=1 打开，?ink=0 关闭）">墨水屏</button>
          </div>
        </div>

        <div class="field">
          <div class="label">进程</div>
          <div class="meta"><span id="plies">第 0 手</span></div>
        </div>
      </div>

      <p class="note">
        <strong>双人</strong>：一台机器上两人轮流走，红的走完点黑的子接着走，不吃电脑。<br>
        对弈引擎为本站<strong>自写的 Alpha-Beta 搜索</strong>（着法生成已通过 perft 校验），
        只在「人机」档里出手，不含任何第三方代码。
        <span class="credit">
          棋子与棋盘美术素材版权归原作者所有（Android 应用《中国象棋》，作者 cnvcs）。
          本站为非商业的个人博客，此处仅作学习与怀旧展示之用，未作任何修改或再分发；
          如权利人认为不妥，请联系本站即刻移除。
        </span>
      </p>
    </div>
  </div>
</div>

<!-- 沉浸模式的退出按钮：只在 html.immersive 时显示，固定在左上角 -->
<button type="button" id="exitImm" aria-label="退出沉浸模式" title="退出沉浸模式（Esc）">✕ 退出</button>

<audio id="snd-select"  src="audio/select.wav"  preload="auto"></audio>
<audio id="snd-move"    src="audio/move.wav"    preload="auto"></audio>
<audio id="snd-capture" src="audio/capture.wav" preload="auto"></audio>
<audio id="snd-check"   src="audio/check.wav"   preload="auto"></audio>
<audio id="snd-win"     src="audio/win.wav"     preload="auto"></audio>
<audio id="snd-lose"    src="audio/lose.wav"    preload="auto"></audio>

<script src="js/glyphs.js"></script>
<script src="js/ink-core.js"></script>
<script src="js/chess-core.js"></script>
<script src="js/chess-ui.js"></script>
</body>
</html>
